<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listen · Hong Kong Soundscape Network</title>
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .clip { display: grid; gap: 0.75rem; }
    .spec {
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }
    .spec img { display: block; width: 100%; height: auto; }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.45);
      left: 0;
      pointer-events: none;
    }
    audio { width: 100%; }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="index.html">Hong Kong Soundscape Network <span>(stub)</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="methods.html">Methods</a>
        <a href="map.html">Map</a>
        <a href="listen.html" aria-current="page">Listen</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>Listen</h1>
    <p class="lead">Trial clip (~60 s). Spectrogram: 0–10 kHz, FFT 8192, viridis. White line tracks playback; click to seek.</p>

    <article class="card clip">
      <h3>Trial recording</h3>
      <p class="note">Site TBD · MP3 ~597 KB</p>
      <div class="spec" id="spec">
        <img src="assets/spectrograms/trial-full.png" alt="Spectrogram of the full trial recording" width="1600" height="420" />
        <div class="playhead" id="playhead"></div>
      </div>
      <audio id="player" controls preload="metadata" src="assets/audio/trial.mp3"></audio>
    </article>

    <footer>Prototype stub · coordinates provisional · more clips welcome</footer>
  </main>
  <script>
    const audio = document.getElementById("player");
    const spec = document.getElementById("spec");
    const head = document.getElementById("playhead");

    function place() {
      const d = audio.duration;
      if (!d || !isFinite(d)) return;
      head.style.left = (audio.currentTime / d * 100) + "%";
    }
    audio.addEventListener("timeupdate", place);
    audio.addEventListener("seeked", place);
    audio.addEventListener("loadedmetadata", place);

    spec.addEventListener("click", (e) => {
      const d = audio.duration;
      if (!d || !isFinite(d)) return;
      const rect = spec.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * d;
      place();
    });
  </script>
</body>
</html>
